# Builds installers for every platform and publishes one GitHub Release.
#   git tag v1.2.3 && git push origin v1.2.3        (or: Actions → Release → Run workflow)
#
# Every installer has a fixed file name (no version in it), so links such as
#   https://github.com/<owner>/<repo>/releases/latest/download/OpenPOS-Setup-x64.exe
# (used in README.md) always download the newest release.
#
# Flow: prepare (draft release) → desktop ×3, android, web (in parallel) → publish.
# iPhone/iPad use the web app (Add to Home Screen); a native iOS build needs an Apple Developer
# account, see docs/DEPLOYMENT.md §5.
#
# Optional secrets (the builds still work without them, see docs/DEPLOYMENT.md):
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#            (without them the APK is signed with a throwaway key, so it can't update the previous one)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK (base64 Developer ID .p12), MAC_CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarisation)
#            (without them the app is ad-hoc signed: electron-builder.mac-adhoc.yml)
# Optional variable: WEB_APP_URL (default https://appkasapos.netlify.app), used in the release notes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v + package.json version)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          else tag="v$(node -p "require('./package.json').version")"; fi
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not v<semver> (e.g. v1.2.3)"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "tag=$tag"; echo "version=$version"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, prerelease=$pre)"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — assets will be added/replaced."
          else
            flags=(--draft --title "OpenPOS $TAG" --generate-notes --target "$GITHUB_SHA")
            [ "$PRE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: --win }
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stamp version ${{ needs.prepare.outputs.version }}
        shell: bash
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"

      - name: Build web app
        run: npx vite build

      - name: Configure code signing (only if secrets exist)
        shell: bash
        env:
          WIN_CSC_LINK_S: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_S: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK_S: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD_S: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_S: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder treats an empty CSC_LINK as "sign with nothing", so only export real values.
          put() { if [ -n "$2" ]; then printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; fi; }
          case "$RUNNER_OS" in
            Windows) link="$WIN_CSC_LINK_S"; pass="$WIN_CSC_KEY_PASSWORD_S" ;;
            macOS)   link="$MAC_CSC_LINK_S"; pass="$MAC_CSC_KEY_PASSWORD_S" ;;
            *)       link=""; pass="" ;;
          esac
          if [ -n "$link" ]; then
            put CSC_LINK "$link"; put CSC_KEY_PASSWORD "$pass"; echo "Code signing: enabled"
          else
            put CSC_IDENTITY_AUTO_DISCOVERY false; echo "Code signing: not configured — building unsigned"
            if [ "$RUNNER_OS" = macOS ]; then
              put EB_CONFIG electron-builder.mac-adhoc.yml; echo "macOS: ad-hoc signature"
            fi
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$link" ] && [ -n "$APPLE_ID_S" ]; then
            put APPLE_ID "$APPLE_ID_S"; put APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD_S"; put APPLE_TEAM_ID "$APPLE_TEAM_ID_S"
            echo "Notarisation: enabled"
          fi

      # The files go straight to the draft release (no workflow artifacts: private repos only get
      # 500 MB of artifact storage on the Free plan, less than one set of installers).
      - name: Build installers and upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish always ${EB_CONFIG:+--config "$EB_CONFIG"}

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          echo "Checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)'
          lipo -archs "$app/Contents/MacOS/$(basename "$app" .app)"

      - name: List files
        shell: bash
        run: ls -l release | grep -v '^d'

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Stamp version ${{ needs.prepare.outputs.version }}
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"

      - name: Build web app and sync into the Android project
        run: |
          npx vite build
          npx cap sync android

      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openpos-release.keystore"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/openpos-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_* secrets not set — the APK is signed with a throwaway debug key (testing only: a later APK can't update it)"
          fi

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = true ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK/AAB
        run: |
          mkdir -p out
          if [ "${{ steps.keystore.outputs.signed }}" = true ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/OpenPOS-android.apk
            cp android/app/build/outputs/bundle/release/app-release.aab out/OpenPOS-android.aab
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/OpenPOS-android.apk
          fi
          ls -l out

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/* --clobber

  web:
    name: Web build (for self-hosting)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stamp version ${{ needs.prepare.outputs.version }}
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"

      - name: Build web app
        run: npx vite build

      - name: Attach zipped web build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../OpenPOS-web.zip .)
          gh release upload "${{ needs.prepare.outputs.tag }}" OpenPOS-web.zip --clobber

  publish:
    name: Publish release
    needs: [prepare, desktop, android, web]
    if: ${{ always() && needs.prepare.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Add download links to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_SIGNED: ${{ needs.android.outputs.signed }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL || 'https://appkasapos.netlify.app' }}
        run: |
          if gh release view "$TAG" --json body --jq .body | grep -q '^## Download'; then
            echo "The notes already have download links (re-run)"; exit 0
          fi
          d="https://github.com/$GH_REPO/releases/download/$TAG"
          {
            echo "## Download"
            echo
            echo "| Device | Download |"
            echo "|---|---|"
            echo "| Windows 10 / 11 | [Installer]($d/OpenPOS-Setup-x64.exe) · [Portable, no install]($d/OpenPOS-Portable-x64.exe) |"
            echo "| Mac (Apple Silicon and Intel) | [OpenPOS-mac-universal.dmg]($d/OpenPOS-mac-universal.dmg) |"
            echo "| Linux PC (Ubuntu, Debian, Mint) | [.deb]($d/openpos-linux-amd64.deb) · [AppImage, any distro]($d/OpenPOS-linux-x86_64.AppImage) |"
            echo "| Linux ARM (Raspberry Pi 4/5) | [.deb]($d/openpos-linux-arm64.deb) · [AppImage]($d/OpenPOS-linux-arm64.AppImage) |"
            echo "| Android phones and tablets | [OpenPOS-android.apk]($d/OpenPOS-android.apk) |"
            echo "| iPhone and iPad | Open $WEB_APP_URL in Safari → Share → **Add to Home Screen** |"
            echo "| Any device, in the browser | $WEB_APP_URL |"
            echo
            if [ "$ANDROID_SIGNED" != true ]; then
              echo "> [!WARNING]"
              echo "> The Android APK in this release is a **test build** signed with a temporary key. Installing a later version will need an uninstall first, which deletes the data on that device, so back up first."
              echo
            fi
            echo "First launch: see [installing OpenPOS](https://github.com/$GH_REPO#download) for the one-time security prompts on Windows, Mac and Android."
            echo
            gh release view "$TAG" --json body --jq .body
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [ "$PRE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url,assets --jq '"Published " + .url + " with " + (.assets | length | tostring) + " assets"'
