# Publishes the project website in site/ to GitHub Pages: https://imbikramsaha.github.io/openpos/
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The demo videos live on the v1.2.0 release rather than in git, so clones stay small.
      - name: Add the demo videos
        run: |
          mkdir -p site/video
          curl -fsSL -o site/video/openpos-demo-1080p.mp4 https://github.com/imbikramsaha/openpos/releases/download/v1.2.0/OpenPOS-demo-1080p.mp4
          curl -fsSL -o site/video/openpos-demo-4k.mp4 https://github.com/imbikramsaha/openpos/releases/download/v1.2.0/OpenPOS-demo-4K.mp4
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
