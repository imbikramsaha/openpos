# Builds the sync server image (server/Dockerfile, which also bundles the web app) and pushes it
# to GitHub Container Registry:  ghcr.io/<owner>/openpos-server:<version> (+ :latest for stable tags)
name: Server image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check for server/Dockerfile
        id: check
        run: |
          if [ -f server/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openpos-server" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::server/Dockerfile not found — nothing to build"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.present == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.present == 'true'

      - uses: docker/login-action@v4
        if: steps.check.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        if: steps.check.outputs.present == 'true'
        with:
          images: ${{ steps.check.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=OpenPOS sync server
            org.opencontainers.image.description=Multi-terminal sync server and web app for OpenPOS

      # Build context is the repository root: the Dockerfile builds dist/ in its first stage.
      - uses: docker/build-push-action@v7
        if: steps.check.outputs.present == 'true'
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
