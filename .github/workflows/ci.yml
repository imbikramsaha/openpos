name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The web build and tests need neither the Electron binary nor Playwright browsers.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  web:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Translations complete
        run: node scripts/i18n-check.mjs --all

      - name: Build web app
        run: npx vite build

      - name: Check desktop + automation scripts
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 14
